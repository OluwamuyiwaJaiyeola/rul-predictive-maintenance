name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Install HF Hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face via HF CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id="ThatBlvck/kataoka-rul-predictive-maintenance",
              repo_type="space",
              ignore_patterns=[
                  ".git*",
                  ".github*",
                  "__pycache__",
                  "*.pyc",
                  "venv",
                  ".env",
                  "mlruns",
                  "notebooks",
              ],
          )
          print("Upload complete.")
          PYEOF
